name: Verify exchange
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minimarket
          POSTGRES_PASSWORD: minimarket
          POSTGRES_DB: minimarket_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U minimarket"
          --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - name: Create browser database
        run: psql postgresql://minimarket:minimarket@localhost:54329/minimarket_test -c 'CREATE DATABASE minimarket_e2e'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
