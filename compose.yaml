services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: minimarket
      POSTGRES_DB: minimarket
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - minimarket-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minimarket']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  minimarket-pg:
